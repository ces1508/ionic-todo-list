<ion-searchbar 
  search-icon="search-circle"
  [placeholder]="selectedText() || placeHolder()"
  (click)="categoryModal.present()" readonly> </ion-searchbar>

<ion-modal #categoryModal>
  <ng-template>
    <app-typeahead
      class="ion-page"
      [title]="typeaheadTitle()"
      [items]="items()"
      [selectedItem]="initalData() ?? 0"
      (selectionChange)="onCategorySelection($event)"
      (selectionCancel)="onCategoryCancel()"
    ></app-typeahead>
  </ng-template>
</ion-modal>
